<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center">
      <button class="btn btn-link text-white p-0 border-0 me-3" type="button" (click)="toggleMenu()">
        <i class="fas fa-bars fs-5"></i>
      </button>
      <span class="navbar-brand mb-0 h1 fw-semibold">Dr. Agro</span>
    </div>
    <button class="btn btn-link text-white p-0" (click)="openSearch()">
      <i class="fas fa-search fs-5"></i>
    </button>
  </div>
</nav>

<!-- Main Content -->
<div class="d-flex flex-column vh-100">
  <div class="flex-grow-1 d-flex flex-column bg-light" style="padding-top: 70px;">
    <div class="container-fluid px-4">
      <div class="row justify-content-center">
        <div class="col-12">
          
          <!-- Title Section -->
          <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-dark mb-0">¿Con que te identificas más?</h1>
          </div>

          <!-- User Types Grid -->
          <div class="row g-3 mb-4">
            
            <!-- Asistente Técnico -->
            <div class="col-6 col-md-4">
              <div class="card user-card h-100" 
                   [class.selected]="selectedUserType === 'asistente'"
                   (click)="selectUserType('asistente')">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-3">
                  <img 
                    src="/images/asistente-icon.png" 
                    alt="Asistente Técnico" 
                    class="user-icon mb-2"
                    style="width: 60px; height: 60px;">
                  <span class="user-label text-center fw-semibold">Asistente Técnico</span>
                </div>
              </div>
            </div>

            <!-- Productor -->
            <div class="col-6 col-md-4">
              <div class="card user-card h-100" 
                   [class.selected]="selectedUserType === 'productor'"
                   (click)="selectUserType('productor')">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-3">
                  <img 
                    src="/images/productor-icon.png" 
                    alt="Productor" 
                    class="user-icon mb-2"
                    style="width: 60px; height: 60px;">
                  <span class="user-label text-center fw-semibold">Productor</span>
                </div>
              </div>
            </div>

            <!-- Estudiante -->
            <div class="col-6 col-md-4">
              <div class="card user-card h-100" 
                   [class.selected]="selectedUserType === 'estudiante'"
                   (click)="selectUserType('estudiante')">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-3">
                  <img 
                    src="/images/estudiante-icon.png" 
                    alt="Estudiante" 
                    class="user-icon mb-2"
                    style="width: 60px; height: 60px;">
                  <span class="user-label text-center fw-semibold">Estudiante</span>
                </div>
              </div>
            </div>

            <!-- Docente -->
            <div class="col-6 col-md-4">
              <div class="card user-card h-100" 
                   [class.selected]="selectedUserType === 'docente'"
                   (click)="selectUserType('docente')">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-3">
                  <img 
                    src="/images/docente-icon.png" 
                    alt="Docente" 
                    class="user-icon mb-2"
                    style="width: 60px; height: 60px;">
                  <span class="user-label text-center fw-semibold">Docente</span>
                </div>
              </div>
            </div>

            <!-- Investigador -->
            <div class="col-6 col-md-4">
              <div class="card user-card h-100" 
                   [class.selected]="selectedUserType === 'investigador'"
                   (click)="selectUserType('investigador')">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-3">
                  <img 
                    src="/images/investigador-icon.png" 
                    alt="Investigador" 
                    class="user-icon mb-2"
                    style="width: 60px; height: 60px;">
                  <span class="user-label text-center fw-semibold">Investigador</span>
                </div>
              </div>
            </div>

            <!-- Público General -->
            <div class="col-6 col-md-4">
              <div class="card user-card h-100" 
                   [class.selected]="selectedUserType === 'publico'"
                   (click)="selectUserType('publico')">
                <div class="card-body d-flex flex-column align-items-center justify-content-center p-3">
                  <img 
                    src="/images/publico-icon.png" 
                    alt="Público General" 
                    class="user-icon mb-2"
                    style="width: 60px; height: 60px;">
                  <span class="user-label text-center fw-semibold">Público General</span>
                </div>
              </div>
            </div>

          </div>

          <!-- Continue Button -->
          <div class="d-grid">
            <button 
              type="button" 
              class="btn btn-success btn-lg rounded-pill fw-semibold px-5"
              [disabled]="!selectedUserType"
              (click)="continueToNextStep()">
              Continuar
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="bg-white border-top py-2 mt-auto">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12 text-center">
          <p class="mb-0 text-muted small">
            © 2025 Todos los derechos reservados. | <span class="fw-bold text-dark">AGROSAVIA</span>
          </p>
        </div>
      </div>
    </div>
  </footer>
</div>
