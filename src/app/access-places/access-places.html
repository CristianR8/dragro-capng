<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark fixed-top shadow-sm">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center">
      <button class="btn btn-link text-white p-0 border-0 me-3" type="button" (click)="toggleMenu()">
        <i class="fas fa-bars fs-5"></i>
      </button>
      <span class="navbar-brand mb-0 h1 fw-semibold">Dr. Agro</span>
    </div>
    <button class="btn btn-link text-white p-0" (click)="openSearch()">
      <i class="fas fa-search fs-5"></i>
    </button>
  </div>
</nav>

<!-- Main Content -->
<div class="d-flex flex-column vh-100">
  <div class="flex-grow-1 d-flex flex-column bg-light" style="padding-top: 70px;">
    <div class="container-fluid px-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6">
          
          <!-- Title Section -->
          <div class="text-center mb-4">
            <h1 class="h2 fw-bold text-dark mb-0">¿Hablamos más de ti?</h1>
          </div>

          <!-- Form Section -->
          <div class="bg-white rounded-3 shadow p-4 mb-4">
            <form (ngSubmit)="onSubmit()" #placesForm="ngForm">
              
              <!-- Departamento Field -->
              <div class="mb-4">
                <label for="departamento" class="form-label fw-semibold text-dark">Departamento</label>
                <select 
                  class="form-select form-select-lg border-2 rounded-2" 
                  id="departamento"
                  name="departamento"
                  [(ngModel)]="departamento"
                  (change)="onDepartamentoChange()"
                  [disabled]="isLoadingDepartamentos"
                  [class.is-invalid]="hasError('departamento')"
                  [class.is-valid]="departamento && !hasError('departamento')">
                  
                  <option value="">
                    {{ isLoadingDepartamentos ? 'Cargando departamentos...' : 'Selecciona un departamento' }}
                  </option>
                  
                  <option *ngFor="let dept of departamentos" [value]="dept.id">
                    {{ dept.nombre }}
                  </option>
                </select>
                
                <div *ngIf="hasError('departamento')" class="invalid-feedback">
                  {{ getError('departamento') }}
                </div>
                
                <div *ngIf="isLoadingDepartamentos" class="text-muted small mt-1">
                  <i class="fas fa-spinner fa-spin me-1"></i>
                  Cargando departamentos desde el servidor...
                </div>
              </div>

              <!-- Ciudad Field -->
              <div class="mb-4">
                <label for="ciudad" class="form-label fw-semibold text-dark">Ciudad</label>
                <select 
                  class="form-select form-select-lg border-2 rounded-2" 
                  id="ciudad"
                  name="ciudad"
                  [(ngModel)]="ciudad"
                  (change)="onCiudadChange()"
                  [disabled]="!departamento || isLoadingCiudades"
                  [class.is-invalid]="hasError('ciudad')"
                  [class.is-valid]="ciudad && !hasError('ciudad')">
                  
                  <option value="">
                    {{ isLoadingCiudades ? 'Cargando ciudades...' : 
                       !departamento ? 'Selecciona primero un departamento' : 
                       'Selecciona una ciudad' }}
                  </option>
                  
                  <option *ngFor="let city of availableCities" [value]="city.id">
                    {{ city.nombre }}
                  </option>
                </select>
                
                <div *ngIf="hasError('ciudad')" class="invalid-feedback">
                  {{ getError('ciudad') }}
                </div>
                
                <div *ngIf="isLoadingCiudades" class="text-muted small mt-1">
                  <i class="fas fa-spinner fa-spin me-1"></i>
                  Cargando ciudades desde el servidor...
                </div>
                
                <div *ngIf="!departamento && !isLoadingDepartamentos" class="text-muted small mt-1">
                  <i class="fas fa-info-circle me-1"></i>
                  Selecciona un departamento para ver las ciudades disponibles
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid">
                <button 
                  type="submit" 
                  class="btn btn-success btn-lg rounded-pill fw-semibold px-5"
                  [disabled]="!isFormValid || isSubmitting">
                  <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
                  {{ isSubmitting ? 'Procesando...' : 'Finalizar' }}
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <footer class="bg-white border-top py-2 mt-auto">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12 text-center">
          <p class="mb-0 text-muted small">
            © 2025 Todos los derechos reservados. | <span class="fw-bold text-dark">AGROSAVIA</span>
          </p>
        </div>
      </div>
    </div>
  </footer>
</div>
